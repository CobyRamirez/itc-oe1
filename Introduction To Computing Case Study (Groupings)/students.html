
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | Blue Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="details.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="index.html">
            <img src="Images/Blue Archive Logo.png" alt="Blue Archive">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a class="active" href="students.html">Students</a>
            <a href="schools.html">Schools</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="page-heading">
            <p class="eyebrow">KIVOTOS DATABASE</p>
            <h1>Student Directory</h1>
            <p>Find students and learn more about their profiles.</p>
        </section>

        <section class="filters">
            <input
                type="search"
                id="student-search"
                placeholder="Search student name..."
                aria-label="Search student name"
            >

            <select id="school-filter" aria-label="Filter by academy">
                <option value="all">All Academies</option>
            </select>
        </section>

        <p id="student-count" class="result-count"></p>
        <section id="student-list" class="card-grid"></section>

        <div id="student-modal" class="modal" hidden>
            <div class="modal-content">
                <button
                    id="close-modal"
                    class="modal-close"
                    aria-label="Close student profile"
                >&times;</button>
                <div id="student-details"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>Blue Archive Student Archive — Unofficial fan project.</p>
    </footer>
</body>
</html>

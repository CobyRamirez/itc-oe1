<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Blue Archive Student Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="contact.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="index.html">
            <img src="Images/Blue Archive Logo.png" alt="Blue Archive">
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="students.html">Students</a>
            <a href="schools.html">Schools</a>
            <a class="active" href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="page-heading">
            <p class="eyebrow">GET IN TOUCH</p>
            <h1>Contact Us</h1>
            <p>Send a message to the Blue Archive Student Archive team.</p>
        </section>

        <form id="contactForm" class="contact-form">
            <div class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>
            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-field">
                <label for="phone">Contact Number</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" required>
            </div>
            <div class="form-field">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <button class="button primary" type="submit">Send</button>
        </form>

        <section id="submission-result" class="submission-result" aria-live="polite" hidden>
            <h2>Submitted Information</h2>
            <p id="submission-status"></p>
            <dl id="displayInfo"></dl>
        </section>
    </main>

    <footer>
        <p>Blue Archive Student Archive — Unofficial fan project.</p>
    </footer>
</body>
</html>
